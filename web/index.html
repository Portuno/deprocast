<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mastropiero</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☿</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fuentes variables (un archivo por familia en vez de siete) y sin frenar el primer pintado: hasta que llegan, la del sistema. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap"></noscript>
  <link rel="stylesheet" href="/estilo.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0f1012">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/icono.svg">
  <script>
    // El tema: el que eligió (oscuro o claro) o, si no eligió, el del sistema.
    try { const t = localStorage.getItem('mastro-tema') || 'sistema'; if (t === 'claro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.dataset.tema = 'claro' } catch {}
  </script>
</head>
<body>
  <!-- iconos -->
  <header class="hud">
    <div class="marca"><span class="mercurio">☿</span><div><b>Mastropiero</b><small>Deprocast 1.0</small></div></div>
    <button class="buscar" id="btn-buscar" title="Buscar o hacer cualquier cosa (Ctrl K)"><svg class="ico" aria-hidden="true"><use href="#i-search"></use></svg><span>Buscar o hacer…</span><kbd>Ctrl K</kbd></button>
    <div class="hud-stats solo-maquina" id="hud"></div>
    <div class="hud-acciones">
      <button class="btn btn-icono btn-validar" id="btn-validar" title="Para validar: lo que espera tu ok"><svg class="ico" aria-hidden="true"><use href="#i-inbox"></use></svg><b id="n-validar"></b></button>
      <button class="btn btn-directo" id="btn-directo" title="Prender el Directo: Mastropiero ve tu pantalla y te escucha">● Directo</button>
      <button class="btn btn-tick solo-maquina" id="btn-tick" title="Purga → reparte → corre (barra espaciadora)">▶ Tick</button>
      <button class="btn btn-auto" id="btn-auto" title="Ticks automáticos">Auto</button>
      <button class="btn btn-icono solo-maquina" id="btn-cronica" title="Mostrar u ocultar la crónica (los eventos de la liga)"><svg class="ico" aria-hidden="true"><use href="#i-list"></use></svg></button>
      <button class="btn btn-icono solo-maquina" id="btn-estado" title="Exportar o importar todo el estado (para llevarlo a otra compu)"><svg class="ico" aria-hidden="true"><use href="#i-arrow-up-down"></use></svg></button>
      <button class="btn btn-icono" id="btn-tema" title="Tema: oscuro, claro o el del sistema"><svg class="ico" aria-hidden="true"><use href="#i-sun-moon"></use></svg></button>
    </div>
  </header>

  <!-- Los 7 espacios (y La máquina): los arma 90-arranque.js desde ESPACIOS. -->
  <nav class="nav" id="nav" aria-label="Espacios">
    <button class="nav-plegar" id="nav-plegar" title="Plegar el menú">‹</button>
    <div class="nav-espacios" id="nav-espacios"></div>
  </nav>

  <div class="lienzo">
    <div class="pestanas-espacio" id="pestanas" role="tablist" aria-label="Secciones del espacio" hidden></div>
    <main class="principal" id="principal"></main>
  </div>

  <!-- En el celular: lo de todos los días abajo, al alcance del pulgar. -->
  <nav class="barra-abajo" id="barra-abajo" aria-label="Lo principal">
    <button data-abajo="hoy"><svg class="ico" aria-hidden="true"><use href="#i-sun"></use></svg><span>Hoy</span></button>
    <button data-abajo="chat"><svg class="ico" aria-hidden="true"><use href="#i-message-circle"></use></svg><span>Chat</span></button>
    <button data-abajo="buscar"><svg class="ico" aria-hidden="true"><use href="#i-search"></use></svg><span>Buscar</span></button>
    <button data-abajo="validar"><svg class="ico" aria-hidden="true"><use href="#i-inbox"></use></svg><span>Validar</span><b id="n-validar-abajo"></b></button>
    <button data-abajo="mas"><svg class="ico" aria-hidden="true"><use href="#i-ellipsis"></use></svg><span>Más</span></button>
  </nav>

  <aside class="cronica" id="cronica">
    <h2>Crónica <button class="btn btn-chico btn-icono" id="cronica-cerrar" title="Ocultar la crónica (☰ arriba la vuelve a mostrar)">✕</button></h2>
    <div id="cronica-lista" class="cronica-lista"></div>
  </aside>

  <div class="velo" id="velo" hidden><div class="modal" id="modal"></div></div>
  <div class="toasts" id="toasts"></div>
  <!-- El núcleo (Hoy, chat, HUD, Directo, liga) carga al arrancar, en orden: comparte el ámbito global; el arranque va último.
       Las vistas marcadas data-perezoso no se cargan acá: el servidor las saca del HTML y las anuncia en window.PEREZOSOS
       (05-comun.js las pide la primera vez que se abren). data-necesita: lo que tiene que estar antes. -->
  <script defer src="/js/00-base.js"></script>
  <script defer src="/js/05-comun.js"></script>
  <script defer src="/js/10-menciones.js"></script>
  <script defer src="/js/15-paleta.js"></script>
  <script defer src="/js/20-liga.js"></script>
  <script defer src="/js/30-hoy.js"></script>
  <script defer src="/js/31-hud.js"></script>
  <script defer src="/js/44-bucles.js"></script>
  <script defer src="/js/47-bandeja.js"></script>
  <script defer src="/js/60-chat.js"></script>
  <script defer src="/js/65-voz.js"></script>
  <script defer src="/js/70-directo.js"></script>
  <script defer src="/js/72-vivo.js"></script>
  <script defer src="/js/80-estado.js"></script>
  <script defer src="/js/90-arranque.js"></script>
  <script data-perezoso src="/js/40-personajes.js" data-necesita="43-evidencia.js 43-modelos.js"></script>
  <script data-perezoso src="/js/42-personas.js"></script>
  <script data-perezoso src="/js/43-evidencia.js"></script>
  <script data-perezoso src="/js/43-modelos.js"></script>
  <script data-perezoso src="/js/45-radar.js" data-necesita="46-calendario.js 46-mapa.js"></script>
  <script data-perezoso src="/js/46-mapa.js"></script>
  <script data-perezoso src="/js/46-calendario.js"></script>
  <script data-perezoso src="/js/47-cuentas.js"></script>
  <script data-perezoso src="/js/48-mano.js"></script>
  <script data-perezoso src="/js/50-saber.js"></script>
  <script data-perezoso src="/js/52-criba.js" data-necesita="50-saber.js"></script>
  <script data-perezoso src="/js/53-cuadernos.js" data-necesita="50-saber.js"></script>
  <script data-perezoso src="/js/54-libreria.js" data-necesita="53-cuadernos.js"></script>
  <script data-perezoso src="/js/55-taller.js"></script>
  <script data-perezoso src="/js/56-tandas.js"></script>
  <script data-perezoso src="/js/57-estudio.js" data-necesita="55-taller.js"></script>
  <script data-perezoso src="/js/57-fragua.js"></script>
  <script data-perezoso src="/js/57-revision.js"></script>
  <script data-perezoso src="/js/58-linea.js"></script>
  <script data-perezoso src="/js/58-salud.js"></script>
  <script data-perezoso src="/js/59-aprender.js"></script>
  <script data-perezoso src="/js/59-idiomas.js"></script>
  <script data-perezoso src="/js/59-suenos.js"></script>
  <script data-perezoso src="/js/62-discovery.js"></script>
  <script data-perezoso src="/js/63-grafo.js"></script>
  <script data-perezoso src="/js/64-agentes.js"></script>
  <script data-perezoso src="/js/66-observatorio.js"></script>
  <script data-perezoso src="/js/68-informe.js"></script>
  <script data-perezoso src="/js/81-segmento.js"></script>
  <script data-perezoso src="/js/82-explorar.js"></script>
</body>
</html>
