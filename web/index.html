<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mastropiero</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☿</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/estilo.css">
  <script>
    try { const t = localStorage.getItem('mastro-tema'); if (t) document.documentElement.dataset.tema = t } catch {}
  </script>
</head>
<body>
  <header class="hud">
    <div class="marca"><span class="mercurio">☿</span><div><b>Mastropiero</b><small>Deprocast 1.0</small></div></div>
    <div class="hud-stats" id="hud"></div>
    <div class="hud-acciones">
      <button class="btn btn-directo" id="btn-directo" title="Prender el Directo: Mastropiero ve tu pantalla y te escucha">● Directo</button>
      <button class="btn btn-tick solo-maquina" id="btn-tick" title="Purga → reparte → corre (barra espaciadora)">▶ Tick</button>
      <button class="btn btn-auto solo-maquina" id="btn-auto" title="Ticks automáticos">Auto</button>
      <button class="btn btn-icono" id="btn-cronica" title="Mostrar u ocultar la crónica (los eventos de la liga)">☰</button>
      <button class="btn btn-icono" id="btn-tema" title="Tema claro u oscuro">◐</button>
    </div>
  </header>

  <nav class="nav" id="nav">
    <button class="nav-plegar" id="nav-plegar" title="Plegar el menú">‹</button>
    <small>Mastropiero</small>
    <button data-vista="hoy" class="activo"><i>☀</i><span>Hoy</span></button>
    <button data-vista="chat"><i>☿</i><span>Chat</span></button>
    <button data-vista="misiones"><i>⚔</i><span>Misiones</span></button>
    <button data-vista="directo"><i>◎</i><span>Directo</span></button>
    <button data-vista="jugador"><i>◉</i><span>Jugador</span></button>
    <small>Saber</small>
    <button data-vista="corpus"><i>❦</i><span>Corpus</span></button>
    <button data-vista="entidades"><i>⚇</i><span>Entidades</span></button>
    <button class="nav-grupo" id="nav-maquina" title="La liga de agentes por dentro"><i>⚙</i><span>La máquina</span><em>▸</em></button>
    <div class="nav-sub" id="nav-sub-maquina">
      <button data-vista="liga"><i>♛</i><span>Roster</span></button>
      <button data-vista="forja"><i>⚒</i><span>Forja</span></button>
      <button data-vista="encargos"><i>⇄</i><span>Encargos</span></button>
      <button data-vista="matriz"><i>⬡</i><span>Matriz 72</span></button>
      <button data-vista="cementerio"><i>✝</i><span>Cementerio</span></button>
    </div>
  </nav>

  <main class="principal" id="principal"></main>

  <aside class="cronica" id="cronica">
    <h2>Crónica <button class="btn btn-chico btn-icono" id="cronica-cerrar" title="Ocultar la crónica (☰ arriba la vuelve a mostrar)">✕</button></h2>
    <div id="cronica-lista" class="cronica-lista"></div>
  </aside>

  <div class="velo" id="velo" hidden><div class="modal" id="modal"></div></div>
  <div class="toasts" id="toasts"></div>
  <!-- Scripts comunes, en orden: comparten el ámbito global; el arranque (registro de vistas) va último. -->
  <script defer src="/js/00-base.js"></script>
  <script defer src="/js/10-menciones.js"></script>
  <script defer src="/js/20-liga.js"></script>
  <script defer src="/js/30-hoy.js"></script>
  <script defer src="/js/40-personajes.js"></script>
  <script defer src="/js/50-saber.js"></script>
  <script defer src="/js/60-chat.js"></script>
  <script defer src="/js/70-directo.js"></script>
  <script defer src="/js/90-arranque.js"></script>
</body>
</html>
